
plugins { 
    id "com.android.application" 
    id "org.jetbrains.kotlin.android" 
    id "dev.flutter.flutter-gradle-plugin" 
    id "com.google.protobuf" version "0.9.4" 
    id "com.squareup.wire" version "5.3.1"
}

wire {
    kotlin {
        android = true
    }
    protoPath {
        srcDir 'src/main/protos'
    }
    sourcePath {
        srcDir 'src/main/protos/'
        include '**'
    }
}


def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

boolean hasKeyStore = false

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    hasKeyStore = true
} else {
    println "+++"
    println "No keystore defined. The app will not be signed."
    println "Create a android/key.properties file with the following properties:"
    println "storePassword"
    println "keyPassword"
    println "keyAlias"
    println "storeFile"
    println "+++"
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')?: '1'

def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

android {
    namespace 'com.hiddify.hiddify'
    testNamespace "test.com.hiddify.hiddify"
    compileSdkVersion 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // namespace вище лишається апстрімовим: це Kotlin-пакет, і його зміна
        // потягла б перенесення всіх .kt та .aidl, ламаючи merge з upstream.
        applicationId "dev.anatolii.lampa"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    // Перелік ABI приходить із двох джерел, і вони конфліктують:
    //   * локально `flutter build apk --split-per-abi` передає -Psplit-per-abi
    //     і сам звужує abiFilters до потрібних архітектур;
    //   * CI збирає через fastforge, де прапорця немає, і Flutter лишає типові
    //     три ABI — тому там перелік доводиться звужувати вручну.
    // AGP не пускає abiFilters разом із увімкненим splits, тож вмикаємо рівно
    // одне з двох залежно від того, як нас запустили.
    def flutterSplitsAbi = project.hasProperty('split-per-abi')

    splits {
        abi {
            enable !flutterSplitsAbi
            reset()
            // Саме цей список, а не abiFilters нижче, керує тим, які APK
            // виробляє gradle. x86_64 прибрано: це архітектура емуляторів.
            //noinspection ChromeOsAbiSupport
            include "armeabi-v7a", "arm64-v8a"

            // Без universal: він важив 298 МБ, його ніхто не ставив (сайт веде
            // на arm64, для старих телефонів є arm7), а час на нього витрачався
            // двічі — при пакуванні й при перекиданні артефакту між задачами.
            universalApk false
        }
    }

    if (hasKeyStore) {
        signingConfigs {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            if (hasKeyStore) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            ndk {
                // Лише коли splits вимкнено — див. пояснення вище.
                // x86_64 прибрано: це архітектура емуляторів, серед реальних
                // телефонів її практично немає, а нативні бібліотеки ядра
                // важать десятки мегабайт на кожну ABI.
                if (!flutterSplitsAbi) {
                    //noinspection ChromeOsAbiSupport
                    abiFilters "armeabi-v7a", "arm64-v8a"
                }
                // Символи потрібні для читабельних крешів у Play Console, куди
                // ми не публікуємось. У релізі v0.0.1 вони дали APK на 341 МБ —
                // непідйомно для роздачі кнопкою з сайту.
                debugSymbolLevel 'NONE'
            }
        }
    }

    buildFeatures {
        viewBinding true
        aidl true
    }

}

android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        output.versionCodeOverride = android.defaultConfig.versionCode
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])

    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    implementation "androidx.compose.ui:ui:1.7.8"
    implementation("com.squareup.wire:wire-grpc-client:5.3.1")

    implementation 'io.grpc:grpc-okhttp:1.64.0'
    implementation 'io.grpc:grpc-protobuf-lite:1.64.0'
    implementation 'io.grpc:grpc-stub:1.64.0'
//    protoPath(project(':hiddify_api'))
//    implementation project(':hiddify_api')




}
